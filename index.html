<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приглашение на свадьбу</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Forum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        :root {
            --accent: #800000;
            --bg-light: #f2f1df; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            background-color: #000;
            font-family: 'Ruslan Display', cursive;
            scroll-behavior: smooth;
            overflow-x: hidden; 
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .block-one {
            width: 100%;
            height: 100vh; 
            background: url('image.png') no-repeat center top;
            background-size: cover;
            display: block; 
        }

        .music-strip {
            background-color: var(--bg-light);
            padding: 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            border-top: 1px solid rgba(128, 0, 0, 0.05);
            border-bottom: 1px solid rgba(128, 0, 0, 0.05);
            position: relative;
            z-index: 5;
        }

        .music-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .music-icon {
            width: 34px;
            height: 34px;
            fill: var(--accent);
            background: #fff;
            border-radius: 50%;
            padding: 7px;
            margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border: 1px solid rgba(128, 0, 0, 0.1);
        }

        .music-text {
            color: var(--accent);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0.3px 0 0 var(--accent);
        }

        .image-block {
            width: 100%;
            line-height: 0;
            margin-top: -1px; 
        }

        .image-block img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* УВЕЛИЧЕННЫЙ БЛОК МЕСТО ПРОВЕДЕНИЯ */
        .location-section {
            background-color: var(--bg-light);
            padding: 80px 30px; /* Увеличили вертикальные отступы */
            text-align: center;
            color: var(--accent);
        }

        .section-title {
            /* Шрифт как песнопения, но крупнее */
            font-family: 'Ruslan Display', cursive;
            font-size: clamp(28px, 9vw, 36px); 
            margin-bottom: 50px;
            text-transform: uppercase;
            text-shadow: 0.5px 0 0 var(--accent);
        }

        /* Специальное исключение для заголовка Место проведения, если нужно оставить Playfair */
        .location-section .section-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-shadow: none;
            font-weight: 700;
        }

        .loc-item {
            margin-bottom: 60px; /* Больше пространства между пунктами */
        }

        .loc-name {
            font-family: 'Ruslan Display', cursive;
            font-size: clamp(20px, 6vw, 24px);
            margin-bottom: 15px;
            text-decoration: underline;
            text-underline-offset: 6px;
            text-shadow: 0.4px 0 0 var(--accent);
            letter-spacing: 0.5px;
        }

        .loc-address {
            font-family: 'Ruslan Display', cursive;
            font-size: clamp(16px, 4.5vw, 19px);
            line-height: 1.6;
            opacity: 1;
            letter-spacing: 0.5px;
            text-shadow: 0.3px 0 0 var(--accent);
        }

        .swiper {
            width: 100%;
            aspect-ratio: 16 / 10; /* Сделали слайдер чуть шире визуально */
            margin-bottom: 50px;
            border: 1px solid rgba(128, 0, 0, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* АНКЕТА */
        .rsvp-section {
            background-color: var(--bg-light);
            padding: 80px 20px;
            color: var(--accent);
            text-align: center;
        }

        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 40px;
            text-align: left;
            max-width: 420px;
            margin: 0 auto;
        }

        .form-group label {
            font-size: 20px;
            display: block;
            margin-bottom: 15px;
            text-shadow: 0.4px 0 0 var(--accent);
        }

        .rsvp-form input[type="text"] {
            width: 100%;
            padding: 15px 5px;
            border: none;
            border-bottom: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-family: 'Ruslan Display', cursive;
            font-size: 18px;
            outline: none;
            text-shadow: 0.3px 0 0 var(--accent);
        }

        .radio-group label {
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            text-shadow: 0.3px 0 0 var(--accent);
        }

        .submit-btn {
            margin-top: 20px;
            padding: 25px;
            background-color: var(--accent);
            color: var(--bg-light);
            border: none;
            font-family: 'Ruslan Display', cursive;
            font-size: 20px;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .playing .music-icon {
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(128, 0, 0, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(128, 0, 0, 0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <section class="block-one"></section>

    <div class="music-strip">
        <div class="music-control" id="musicBtn" onclick="toggleMusic()">
            <svg class="music-icon" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span class="music-text" id="statusText">включить песнопения</span>
        </div>
    </div>

    <section class="image-block"><img src="2.jpg" alt=""></section>

    <section class="location-section">
        <h2 class="section-title">Место проведения</h2>
        
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="место1.jpeg" alt="Ратуша"></div>
                <div class="swiper-slide"><img src="место2.jpeg" alt="Костёл"></div>
                <div class="swiper-slide"><img src="место3.jpeg" alt="Ресторан"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="loc-item">
            <div class="loc-name">Торжественная регистрация</div>
            <div class="loc-address">Ратуша<br>г. Несвиж, ул. Советская, 3</div>
        </div>
        
        <div class="loc-item">
            <div class="loc-name">Шлюб</div>
            <div class="loc-address">Костёл «Божага цела»<br>г. Несвиж, ул. Гейсика</div>
        </div>
        
        <div class="loc-item">
            <div class="loc-name">Банкет</div>
            <div class="loc-address">Ресторан «Трактир для друзей»<br>г. Городея, ул. Гагарина</div>
        </div>
    </section>

    <section class="image-block"><img src="3.jpg" alt=""></section>
    <section class="image-block"><img src="4.jpg" alt=""></section>

    <section class="rsvp-section">
        <h2 class="section-title">Анкета гостя</h2>
        <form class="rsvp-form" id="weddingForm">
            <div class="form-group">
                <label>Как величать вас?</label>
                <input type="text" name="guest_name" required placeholder="Ваш ответ...">
            </div>

            <div class="form-group">
                <label>Сможете ли разделить радость?</label>
                <div class="radio-group">
                    <label><input type="radio" name="attendance" value="yes" required> Да, прибуду</label>
                    <label><input type="radio" name="attendance" value="no"> Увы, не смогу</label>
                </div>
            </div>

            <div class="form-group">
                <label>Будете ли не один?</label>
                <div class="radio-group">
                    <label><input type="radio" name="companion" value="no" required onclick="toggleCompanion(false)"> Буду в одиночестве</label>
                    <label><input type="radio" name="companion" value="yes" onclick="toggleCompanion(true)"> Буду со спутником</label>
                </div>
            </div>

            <div class="companion-container" id="compContainer">
                <div class="companion-inner">
                    <label>Имя спутника?</label>
                    <input type="text" name="companion_name" id="companion_name" placeholder="Введите имя...">
                </div>
            </div>

            <button type="submit" class="submit-btn">Отправить весточку</button>
        </form>
    </section>

    <section class="image-block"><img src="5.jpg" alt=""></section>
</div>

<audio id="bgMusic" src="песня.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: { delay: 3500, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
    });

    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    const statusText = document.getElementById('statusText');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            btn.classList.remove('playing');
            statusText.textContent = 'включить песнопения';
        } else {
            music.play().catch(e => console.log("Нужен клик"));
            btn.classList.add('playing');
            statusText.textContent = 'песнопения звучат';
        }
        isPlaying = !isPlaying;
    }

    function toggleCompanion(show) {
        const container = document.getElementById('compContainer');
        const inputField = document.getElementById('companion_name');
        if (show) {
            container.classList.add('visible');
            inputField.setAttribute('required', 'required');
        } else {
            container.classList.remove('visible');
            inputField.removeAttribute('required');
            inputField.value = '';
        }
    }

    document.getElementById('weddingForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Спасибо! Ваша весточка отправлена.');
    };
</script>
</body>
</html>
