<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приглашение на свадьбу</title>
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --accent: #800000;
            --bg-light: #f5f3e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            background-color: #000;
            font-family: 'Ruslan Display', cursive;
            scroll-behavior: smooth;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* БЛОК 1: ОБЛОЖКА */
        .block-one {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: url('image.png') no-repeat center top;
            background-size: cover;
        }

        /* МУЗЫКАЛЬНАЯ КНОПКА (МАКСИМАЛЬНО НИЗКО) */
        .music-control {
            position: absolute;
            /* Установлено на самый минимум */
            bottom: 2px; 
            margin-bottom: env(safe-area-inset-bottom, 2px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            width: 100%;
            padding-bottom: 5px;
        }

        .music-icon {
            width: clamp(24px, 7vw, 28px);
            height: clamp(24px, 7vw, 28px);
            fill: var(--accent);
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            padding: 5px;
            margin-bottom: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .music-text {
            color: var(--accent);
            font-size: clamp(8px, 2.5vw, 9px);
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        /* ИЗОБРАЖЕНИЯ */
        .image-block {
            width: 100%;
            line-height: 0;
        }

        .image-block img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ЛОКАЦИИ */
        .location-section {
            background-color: var(--bg-light);
            padding: clamp(30px, 8vw, 50px) 20px;
            text-align: center;
            color: var(--accent);
        }

        .section-title {
            font-size: clamp(24px, 7vw, 32px);
            margin-bottom: clamp(20px, 6vw, 30px);
            text-transform: uppercase;
        }

        .swiper {
            width: 100%;
            aspect-ratio: 4 / 3;
            max-height: 300px;
            margin-bottom: 25px;
            border: 2px solid var(--accent);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loc-item {
            margin-bottom: 30px;
        }

        .loc-name {
            font-size: clamp(18px, 5vw, 22px);
            margin-bottom: 5px;
            text-decoration: underline;
        }

        .loc-address {
            font-family: 'Georgia', serif;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* АНКЕТА */
        .rsvp-section {
            background-color: var(--bg-light);
            padding: 40px 20px;
            color: var(--accent);
            text-align: center;
        }

        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
            font-family: 'Georgia', serif;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question {
            font-size: 16px;
            font-weight: bold;
        }

        .rsvp-form input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 16px;
            outline: none;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .radio-group input {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 18px;
            background-color: var(--accent);
            color: var(--bg-light);
            border: none;
            font-family: 'Ruslan Display', cursive;
            font-size: 18px;
            cursor: pointer;
        }

        /* АНИМАЦИЯ ПУЛЬСАЦИИ */
        .playing .music-icon {
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Специальная коррекция для невысоких экранов (iPhone 6/7/8/SE) */
        @media (max-height: 670px) {
            .music-control {
                bottom: 0px; 
                padding-bottom: 2px;
            }
            .music-icon {
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <section class="block-one">
        <div class="music-control" id="musicBtn" onclick="toggleMusic()">
            <svg class="music-icon" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span class="music-text" id="statusText">включить песнопения</span>
        </div>
    </section>

    <section class="image-block"><img src="2.jpg" alt=""></section>

    <section class="location-section">
        <h2 class="section-title">Место проведения</h2>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="место1.jpeg" alt="Ратуша"></div>
                <div class="swiper-slide"><img src="место2.jpeg" alt="Костёл"></div>
                <div class="swiper-slide"><img src="место3.jpeg" alt="Ресторан"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="loc-item">
            <div class="loc-name">Торжественная регистрация</div>
            <div class="loc-address">Ратуша<br>г. Несвиж, ул. Советская, 3</div>
        </div>
        <div class="loc-item">
            <div class="loc-name">Шлюб</div>
            <div class="loc-address">Костёл «Божага цела»<br>г. Несвиж, ул. Гейсика</div>
        </div>
        <div class="loc-item">
            <div class="loc-name">Банкет</div>
            <div class="loc-address">Ресторан «Трактир для друзей»<br>г. Городея, ул. Гагарина</div>
        </div>
    </section>

    <section class="image-block"><img src="3.jpg" alt=""></section>
    <section class="image-block"><img src="4.jpg" alt=""></section>

    <section class="rsvp-section">
        <h2 class="section-title">Ответное слово</h2>
        <form class="rsvp-form" id="weddingForm">
            <div class="form-group">
                <label class="question">Как величать вас?</label>
                <input type="text" name="guest_name" required placeholder="Ваш ответ...">
            </div>
            <div class="form-group">
                <label class="question">Сможете ли разделить радость?</label>
                <div class="radio-group">
                    <label><input type="radio" name="attendance" value="yes" required> Да, прибуду</label>
                    <label><input type="radio" name="attendance" value="no"> Увы, не смогу</label>
                </div>
            </div>
            <div class="form-group">
                <label class="question">Будете ли не один?</label>
                <div class="radio-group">
                    <label><input type="radio" name="companion" value="no" checked onclick="document.getElementById('compInput').style.display='none'"> Буду в одиночестве</label>
                    <label><input type="radio" name="companion" value="yes" onclick="document.getElementById('compInput').style.display='flex'"> Буду со спутником</label>
                </div>
            </div>
            <div class="form-group" id="compInput" style="display:none">
                <label class="question">Имя спутника?</label>
                <input type="text" name="companion_name" placeholder="Как величать спутника?">
            </div>
            <button type="submit" class="submit-btn">Отправить весточку</button>
        </form>
    </section>

    <section class="image-block"><img src="5.jpg" alt=""></section>
</div>

<audio id="bgMusic" src="песня.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // Инициализация слайдера
    const swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: { delay: 3500, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
    });

    // Управление музыкой
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    const statusText = document.getElementById('statusText');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            btn.classList.remove('playing');
            statusText.textContent = 'включить песнопения';
        } else {
            music.play().catch(e => console.log("Взаимодействие не зафиксировано браузером"));
            btn.classList.add('playing');
            statusText.textContent = 'песнопения звучат';
        }
        isPlaying = !isPlaying;
    }

    // Обработка формы (заглушка)
    document.getElementById('weddingForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Спасибо! Ваша весточка отправлена.');
    };
</script>
</body>
</html>
