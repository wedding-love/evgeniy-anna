<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение</title>
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #921a1a; 
            --bg-color: #f4f1ea;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-color);
            font-family: 'Ruslan Display', cursive;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .block {
            position: relative;
            width: 100%;
            max-width: 500px;
            /* Используем динамическую высоту */
            min-height: 100vh;
            min-height: 100dvh; 
            
            /* --- ОПТИМИЗАЦИЯ ФОТО --- */
            background-size: cover; /* Заполняет блок полностью */
            background-position: center center; /* Центрирует изображение */
            background-repeat: no-repeat;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Блоки с изображениями */
        .first-block { background-image: url('image.png'); }
        .second-block { background-image: url('2.jpg'); }
        .third-block { background-image: url('3.jpg'); }
        .fourth-block { background-image: url('4.jpg'); }

        /* Музыкальный блок */
        .music-block {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom)); 
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .music-icon {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .music-text {
            color: var(--accent-color);
            font-size: 14px;
            text-transform: uppercase;
            background: rgba(244, 241, 234, 0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        .playing .music-icon {
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        #bg-music { display: none; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="block first-block">
            <div class="music-block" id="music-trigger">
                <span class="music-icon">♪</span>
                <span class="music-text" id="status-text">Включить песнопения</span>
            </div>
        </div>
        <div class="block second-block"></div>
        <div class="block third-block"></div>
        <div class="block fourth-block"></div>
    </div>

    <audio id="bg-music" src="песня.mp3" loop></audio>

    <script>
        const musicBlock = document.getElementById('music-trigger');
        const music = document.getElementById('bg-music');
        const statusText = document.getElementById('status-text');

        musicBlock.addEventListener('click', function() {
            if (music.paused) {
                music.play().then(() => {
                    musicBlock.classList.add('playing');
                    statusText.textContent = 'Музыка звучит';
                }).catch(err => console.log("Нужен клик для запуска"));
            } else {
                music.pause();
                musicBlock.classList.remove('playing');
                statusText.textContent = 'Включить песнопения';
            }
        });
    </script>
</body>
</html>
