<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение</title>
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #921a1a; 
            --bg-color: #f4f1ea;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth; /* Плавная прокрутка */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: var(--bg-color);
            font-family: 'Ruslan Display', cursive;
            overflow-x: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .block {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            height: 100dvh; /* Динамическая высота под мобильные */
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Первый блок (Обложка) */
        .first-block {
            background-image: url('image.png');
        }

        /* Второй блок (Чистое фото) */
        .second-block {
            background-image: url('2.jpg');
        }

        /* Кнопка музыки на главном блоке */
        .music-block {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom)); 
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            user-select: none;
            text-align: center;
            z-index: 10;
        }

        .music-block:active { 
            transform: translateX(-50%) scale(0.95); 
        }

        .music-icon {
            font-size: 28px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .music-text {
            color: var(--accent-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(244, 241, 234, 0.5); /* Полупрозрачная подложка для читаемости */
            padding: 2px 10px;
            border-radius: 10px;
        }

        /* Анимация пульсации */
        .playing .music-icon {
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        #bg-music { 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="block first-block">
            <div class="music-block" id="music-trigger">
                <span class="music-icon">♪</span>
                <span class="music-text" id="status-text">Включить песнопения</span>
            </div>
        </div>

        <div class="block second-block"></div>
    </div>

    <audio id="bg-music" src="песня.mp3" loop></audio>

    <script>
        const musicBlock = document.getElementById('music-trigger');
        const music = document.getElementById('bg-music');
        const statusText = document.getElementById('status-text');

        musicBlock.addEventListener('click', function() {
            if (music.paused) {
                music.play().then(() => {
                    musicBlock.classList.add('playing');
                    statusText.textContent = 'Музыка звучит';
                }).catch(err => {
                    console.log("Автовоспроизведение требует взаимодействия пользователя");
                });
            } else {
                music.pause();
                musicBlock.classList.remove('playing');
                statusText.textContent = 'Включить песнопения';
            }
        });
    </script>
</body>
</html>
