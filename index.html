<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Приглашение на свадьбу</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        :root {
            --accent: #800000;      /* Глубокий красный */
            --bg-light: #f5f3e5;    /* Бежевый фон */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            background-color: #000;
            font-family: 'Ruslan Display', cursive;
            scroll-behavior: smooth;
        }

        /* Контейнер приложения */
        .wrapper {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* БЛОК 1: ОБЛОЖКА */
        .block-one {
            width: 100%;
            height: 100dvh;
            background: url('image.png') no-repeat center top;
            background-size: cover;
        }

        /* ПОЛОСКА С МУЗЫКОЙ (Строго между фото 1 и 2) */
        .music-strip {
            background-color: var(--bg-light);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid rgba(128, 0, 0, 0.05);
        }

        .music-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .music-icon {
            width: 34px;
            height: 34px;
            fill: var(--accent);
            background: #fff;
            border-radius: 50%;
            padding: 7px;
            margin-bottom: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border: 1px solid rgba(128, 0, 0, 0.1);
        }

        .music-text {
            color: var(--accent);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }

        /* ИЗОБРАЖЕНИЯ-БЛОКИ */
        .image-block {
            width: 100%;
            line-height: 0;
        }

        .image-block img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* СЕКЦИЯ ЛОКАЦИЙ */
        .location-section {
            background-color: var(--bg-light);
            padding: 50px 20px;
            text-align: center;
            color: var(--accent);
        }

        .section-title {
            font-size: clamp(24px, 7vw, 30px);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .swiper {
            width: 100%;
            aspect-ratio: 4 / 3;
            max-height: 300px;
            margin-bottom: 30px;
            border: 1px solid rgba(128, 0, 0, 0.2);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loc-item {
            margin-bottom: 35px;
        }

        .loc-name {
            font-size: 20px;
            margin-bottom: 8px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .loc-address {
            font-family: 'Georgia', serif;
            font-size: 14px;
            line-height: 1.5;
        }

        /* АНКЕТА */
        .rsvp-section {
            background-color: var(--bg-light);
            padding: 60px 20px;
            color: var(--accent);
            text-align: center;
        }

        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
            font-family: 'Georgia', serif;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rsvp-form label {
            font-weight: bold;
            font-size: 15px;
        }

        .rsvp-form input[type="text"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-bottom: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 16px;
            outline: none;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-weight: normal;
        }

        .radio-group input {
            accent-color: var(--accent);
            width: 20px;
            height: 20px;
        }

        .submit-btn {
            margin-top: 20px;
            padding: 20px;
            background-color: var(--accent);
            color: var(--bg-light);
            border: none;
            font-family: 'Ruslan Display', cursive;
            font-size: 18px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* АНИМАЦИЯ МУЗЫКИ */
        .playing .music-icon {
            animation: pulse 2s infinite ease-in-out;
            border: 1px solid var(--accent);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(128, 0, 0, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(128, 0, 0, 0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <section class="block-one"></section>

    <div class="music-strip">
        <div class="music-control" id="musicBtn" onclick="toggleMusic()">
            <svg class="music-icon" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span class="music-text" id="statusText">включить песнопения</span>
        </div>
    </div>

    <section class="image-block"><img src="2.jpg" alt=""></section>

    <section class="location-section">
        <h2 class="section-title">Место проведения</h2>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="место1.jpeg" alt="Ратуша"></div>
                <div class="swiper-slide"><img src="место2.jpeg" alt="Костёл"></div>
                <div class="swiper-slide"><img src="место3.jpeg" alt="Ресторан"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <div class="loc-item">
            <div class="loc-name">Торжественная регистрация</div>
            <div class="loc-address">Ратуша<br>г. Несвиж, ул. Советская, 3</div>
        </div>
        <div class="loc-item">
            <div class="loc-name">Шлюб</div>
            <div class="loc-address">Костёл «Божага цела»<br>г. Несвиж, ул. Гейсика</div>
        </div>
        <div class="loc-item">
            <div class="loc-name">Банкет</div>
            <div class="loc-address">Ресторан «Трактир для друзей»<br>г. Городея, ул. Гагарина</div>
        </div>
    </section>

    <section class="image-block"><img src="3.jpg" alt=""></section>
    <section class="image-block"><img src="4.jpg" alt=""></section>

    <section class="rsvp-section">
        <h2 class="section-title">Анкета гостя</h2>
        <form class="rsvp-form" id="weddingForm">
            <div class="form-group">
                <label>Как величать вас?</label>
                <input type="text" name="guest_name" required placeholder="Ваш ответ...">
            </div>

            <div class="form-group">
                <label>Сможете ли разделить радость?</label>
                <div class="radio-group">
                    <label><input type="radio" name="attendance" value="yes" required> Да, прибуду</label>
                    <label><input type="radio" name="attendance" value="no"> Увы, не смогу</label>
                </div>
            </div>

            <div class="form-group">
                <label>Будете ли не один?</label>
                <div class="radio-group">
                    <label><input type="radio" name="companion" value="no" required onclick="toggleCompanion(false)"> Буду в одиночестве</label>
                    <label><input type="radio" name="companion" value="yes" onclick="toggleCompanion(true)"> Буду со спутником</label>
                </div>
            </div>

            <div class="form-group" id="compInput" style="display:none">
                <label>Имя спутника?</label>
                <input type="text" name="companion_name" id="companion_name" placeholder="Введите имя...">
            </div>

            <button type="submit" class="submit-btn">Отправить весточку</button>
        </form>
    </section>

    <section class="image-block"><img src="5.jpg" alt=""></section>
</div>

<audio id="bgMusic" src="песня.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // Инициализация слайдера
    const swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: { delay: 3500, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
    });

    // Музыкальный плеер
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    const statusText = document.getElementById('statusText');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            btn.classList.remove('playing');
            statusText.textContent = 'включить песнопения';
        } else {
            music.play().catch(e => console.log("Нужен клик для старта"));
            btn.classList.add('playing');
            statusText.textContent = 'песнопения звучат';
        }
        isPlaying = !isPlaying;
    }

    // Логика анкеты (скрытие/показ спутника)
    function toggleCompanion(show) {
        const inputDiv = document.getElementById('compInput');
        const inputField = document.getElementById('companion_name');
        
        if (show) {
            inputDiv.style.display = 'flex';
            inputField.setAttribute('required', 'required');
        } else {
            inputDiv.style.display = 'none';
            inputField.removeAttribute('required');
            inputField.value = '';
        }
    }

    // Отправка формы
    document.getElementById('weddingForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Спасибо! Ваша весточка отправлена.');
    };
</script>
</body>
</html>
